name: Go CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(find . -type f -name '*.go' -not -path './.git/*' -not -path './node_modules/*' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Shuffle/repeat tests
        if: matrix.go == '1.27.x'
        run: go test -shuffle=on -count=2 ./...

      - name: Race test
        if: matrix.go == '1.27.x'
        run: go test -race ./...

  vulnerability-scan:
    name: govulncheck (Go 1.27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan reachable vulnerabilities
        run: govulncheck ./...
